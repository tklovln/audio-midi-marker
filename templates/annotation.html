<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ song.title }} · Annotator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        plum: '#7f55b1',
                        lavender: '#9b7ebd',
                        blush: '#f49bab',
                        peach: '#ffe1e0',
                        sand: '#eeece1',
                        rose: '#e16981',
                        ink: '#1f1630'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page page--annotation">
    <header class="site-header site-header--compact">
        <div>
            <!-- <a class="ghost-button" href="{{ url_for('index') }}">&larr; All pieces</a> -->
            
            <p class="eyebrow">Annotating</p>
            <h1>{{ song.title }}</h1>
        </div>
        
    </header>

    <main id="annotation-app" class="annotation-app">
        <section class="panel panel--waveform">
            <div class="panel-head">
                <div>
                    <p class="eyebrow">Audio</p>
                    <h2>Waveform</h2>
                </div>
                <div class="panel-actions">
                    <label class="form-field">
                        Window
                        <select id="window-size">
                            <option value="5">5s</option>
                            <option value="10" selected>10s</option>
                            <option value="15">15s</option>
                            <option value="20">20s</option>
                        </select>
                    </label>
                </div>
            </div>
            <div class="waveform-wrapper" id="waveform-wrapper">
                <canvas id="waveform-canvas" class="waveform-canvas"></canvas>
                <div id="waveform-audio" class="waveform-audio" aria-hidden="true"></div>
                <div id="waveform-cursor" class="panel-cursor"></div>
            </div>
        </section>

        <section class="panel panel--midi">
            <div class="panel-head">
                <div>
                    <p class="eyebrow">MIDI</p>
                    <h2>Piano Roll</h2>
                </div>
                <p id="note-readout" class="note-readout">Hover a note for details.</p>
            </div>
            <div class="midi-wrapper" id="midi-wrapper">
                <div id="midi-grid" class="midi-grid"></div>
                <div id="midi-cursor" class="panel-cursor"></div>
            </div>
        </section>

        <section class="panel panel--viewport">
            <label for="viewport-slider">View window position</label>
            <input type="range" id="viewport-slider" min="0" max="0" value="0" step="0.05">
            <output id="viewport-label">0.0s – 10.0s</output>
            <div class="viewport-nav">
                <button id="jump-prev" class="nav-button" type="button" aria-label="Play previous note">
                    ← Prev
                </button>
                <button id="play-pause" class="primary-button" disabled>Loading…</button>
                <button id="jump-next" class="nav-button" type="button" aria-label="Play next note">
                    Next →
                </button>
            </div>
        </section>

        <!-- <section class="panel panel--notes">
            <div class="panel-head">
                <div>
                    <p class="eyebrow">Notes</p>
                    <h2>Slice playback</h2>
                </div>
                <p class="note-readout">Click a note button to solo that slice.</p>
            </div>
            <div id="note-buttons" class="note-buttons"></div>
        </section> -->

        <section class="panel panel--editor">
            <div class="panel-head">
                <div>
                    <p class="eyebrow">Annotation</p>
                    <h2>Note details</h2>
                </div>
                <p id="annotation-note-label" class="note-readout">Select a note to edit tonal technique or articulation.</p>
            </div>
            <div class="annotation-fields">
                <div class="pie-control flex flex-col items-center gap-4">
                    <p class="text-sm uppercase tracking-wide text-slate-500">Tonal technique</p>
                    <div class="pie-chart-wrapper">
                        <canvas id="pie-tonal"></canvas>
                    </div>
                    <span class="pie-selected text-sm text-slate-500" id="pie-tonal-label">None</span>
                </div>
                <div class="pie-control flex flex-col items-center gap-4">
                    <p class="text-sm uppercase tracking-wide text-slate-500">Articulation</p>
                    <div class="pie-chart-wrapper">
                        <canvas id="pie-articulation"></canvas>
                    </div>
                    <span class="pie-selected text-sm text-slate-500" id="pie-articulation-label">None</span>
                </div>
            </div>
            <div class="annotation-actions">
                <span id="annotation-status" class="annotation-status" role="status" aria-live="polite">
                    Select a note to annotate. Changes save automatically.
                </span>
            </div>
        </section>
    </main>

    <script id="app-config" type="application/json">
        {{ app_config | tojson | safe }}
    </script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
