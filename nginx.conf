
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 8080;
        server_name localhost;

        # 1. Serve static audio/video files directly from the data directory
        #    Maps /data/ -> /nas_data/tkwang/audio-midi-marker/data/
        location /data/ {
            alias /nas_data/tkwang/audio-midi-marker/data/;
            autoindex on;
            expires 30d;
            add_header Access-Control-Allow-Origin *;
        }

        # 2. Proxy all other requests to the Flask app (Gunicorn) running on port 5000
        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
